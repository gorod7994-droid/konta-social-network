.bottle-game{max-width:none;text-align:left}.bottle-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,1fr);gap:14px;align-items:stretch}.bottle-arena{background:repeating-radial-gradient(ellipse at 40% 30%,#cb925a 0 8px,#c18a52 9px 17px,#bb824d 18px 27px);border:8px solid #9c6538;border-radius:18px;padding:16px;text-align:center;box-shadow:inset 0 0 60px #6e3c1e55}.bottle-arena .bottle-table{width:min(100%,600px);margin:25px auto}.bottle-arena .bottle-disc{background:radial-gradient(circle,#f5cc80 0%,#c48a45 55%,#9d642f 100%);border:10px solid #e5b773;box-shadow:inset 0 0 28px #7e421f,0 10px 30px #754219}.bottle-arena .bottle-face{width:clamp(43px,6vw,76px);height:clamp(43px,6vw,76px);background:#f0d4ae;border:3px solid #fff0c7;box-shadow:0 3px 12px #4b291b99;overflow:hidden}.bottle-arena .bottle-seat{width:94px}.bottle-arena .bottle-name{background:#5c311ccc;color:#fff}.bottle-arena .bottle-center{color:#643a20}.bottle-arena .bottle-turn{color:#301e13;text-shadow:0 1px #f8dfb6}.bottle-sidebar{display:flex;flex-direction:column;background:#1a293c;border:1px solid #47607a;border-radius:16px;padding:12px;min-height:480px}.bottle-sidebar .bottle-chat{display:flex;flex-direction:column;flex:1;margin:0;max-width:none}.bottle-sidebar .bottle-chat-log{flex:1;height:350px;max-height:540px}.bottle-sidebar .bottle-history{margin:14px 0 0}.bottle-sidebar .bottle-chat form{flex-wrap:wrap}.bottle-toolbar{margin:10px 0 18px}.bottle-score{justify-content:flex-start}.bottle-score span{font-size:13px}.bottle-arena .bottle-decision{background:#fff6e4e8;padding:12px;border-radius:12px}.bottle-arena .bottle-decision .option{background:#bf4e38}.bottle-arena .bottle-decision .primary{background:#6baf32}.bottle-status{background:#263c56;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#c9d9ef}.bottle-arena .bottle-pointer{font-size:clamp(72px,10vw,110px)}@media(max-width:760px){.bottle-layout{grid-template-columns:1fr}.bottle-sidebar{min-height:280px}.bottle-sidebar .bottle-chat-log{height:220px}.bottle-arena{padding:8px}.bottle-arena .bottle-seat{width:64px}.bottle-arena .bottle-face{width:43px;height:43px}.bottle-arena .bottle-disc{border-width:5px}}
</style></head><body><header><b>🟦 KONTA · Ігри</b><a href="/">← Повернутися до соцмережі</a></header><main><h1>🎮 Ігри KONTA</h1><p class="muted">Обирай гру та відпочивай. Перші власні мініігри KONTA.</p><div class="catalog" id="catalog"></div><section class="panel" id="game" aria-live="polite"><h2>Обери гру вище 👆</h2></section></main><script>
'use strict';
const games=[['bottle','🍾','Пляшечка','Крути пляшечку у компанії'],['avatar','🧑‍🎤','Аватарія KONTA','Створи власного персонажа'],['xo','⭕','Хрестики-нулики','Грай проти комп’ютера'],['snake','🐍','Змійка','Збирай очки й не врізайся']];
const cat=document.querySelector('#catalog'),out=document.querySelector('#game');let active='',timer=null,spin=0;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
cat.innerHTML=games.map(g=>'<button class="tile" data-game="'+g[0]+'"><span class="emoji">'+g[1]+'</span><strong>'+g[2]+'</strong><small>'+g[3]+'</small></button>').join('');
cat.onclick=e=>{const b=e.target.closest('[data-game]');if(b)open(b.dataset.game)};
function open(id){clearInterval(timer);active=id;document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x.dataset.game===id));({bottle,avatar,xo,snake})[id]();}
function bottle(){
out.innerHTML='<div class="bottle-game"><h2>🍾 Бутилочка · онлайн KONTA</h2><div class="bottle-status" id="bottle-status">Підключення до спільного столу…</div><div class="bottle-toolbar"><button class="option" id="bottle-join">Приєднатися до столу</button><button class="option" id="bottle-leave" hidden>Вийти зі столу</button><span id="bottle-online"></span></div><div class="bottle-score" id="bottle-score"></div><div class="bottle-layout"><div class="bottle-arena"><div class="bottle-table"><div class="bottle-disc"></div><div class="bottle-pointer" id="bottle-pointer">🍾</div><div class="bottle-center">KONTA<small>Онлайн</small></div><div id="bottle-seats"></div></div><div class="bottle-turn" id="bottle-turn">Чекаємо на гравців…</div><button class="primary" id="bottle-spin" disabled>🍾 Крутити пляшечку</button><div class="bottle-decision" id="bottle-decision" hidden><button class="primary" id="bottle-kiss">💋 Поцілувати</button><button class="option" id="bottle-pass">🙈 Відмовитися</button></div></div><aside class="bottle-sidebar"><div class="bottle-chat"><h3>💬 Спільний чат</h3><div class="bottle-chat-log" id="bottle-chat-log"></div><form id="bottle-chat-form"><input id="bottle-chat-input" maxlength="300" placeholder="Повідомлення всім…" required><button class="primary" type="submit">➤</button></form></div><div class="bottle-history"><h3>💋 Останні ходи</h3><div id="bottle-log"></div></div></aside></div><p class="muted bottle-note">Спільний публічний стіл для зареєстрованих користувачів KONTA. Фото беруться з профілів. Поцілунок лише за згодою обраного гравця.</p></div>';
const q=x=>out.querySelector(x),status=q('#bottle-status'),seats=q('#bottle-seats'),spin=q('#bottle-spin'),decision=q('#bottle-decision'),pointer=q('#bottle-pointer');
if(!window.supabase||!window.KONTA_CONFIG){status.textContent='Не вдалося завантажити підключення KONTA';return}
const db=window.supabase.createClient(window.KONTA_CONFIG.supabaseUrl,window.KONTA_CONFIG.supabasePublishableKey);
let uid=null,players=[],rounds=[],messages=[],joined=false,loading=false,angle=0,clock=null;
const short=p=>p?.display_name||('@'+p?.username)||'Гравець',isLive=p=>Date.now()-Date.parse(p.last_seen)<120000;
const person=id=>players.find(p=>p.user_id===id);
const name=id=>short(person(id));
const notify=t=>{status.textContent=t};
async function join(){
if(!uid)return;
const {error}=await db.from('bottle_players').upsert({user_id:uid,last_seen:new Date().toISOString()},{onConflict:'user_id'});
if(error){notify('Помилка входу: '+error.message);return}
joined=true;q('#bottle-join').hidden=true;q('#bottle-leave').hidden=false;await refresh();
}
async function refresh(){
if(active!=='bottle'||loading||!uid)return;loading=true;
try{
 if(joined)await db.from('bottle_players').update({last_seen:new Date().toISOString()}).eq('user_id',uid);
 const [p,r,m]=await Promise.all([
 db.from('bottle_players').select('user_id,last_seen').gte('last_seen',new Date(Date.now()-120000).toISOString()).order('joined_at',{ascending:true}).limit(12),
 db.from('bottle_rounds').select('id,spinner_id,target_id,choice,created_at').order('id',{ascending:false}).limit(30),
 db.from('bottle_messages').select('id,user_id,body').order('id',{ascending:false}).limit(60)]);
 if(p.error||r.error||m.error)throw(p.error||r.error||m.error);
 const ids=[...new Set([...(p.data||[]).map(x=>x.user_id),...(r.data||[]).flatMap(x=>[x.spinner_id,x.target_id]),...(m.data||[]).map(x=>x.user_id)])];
 let profiles=[];if(ids.length){const a=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);if(a.error)throw a.error;profiles=a.data||[]}
 const lookup=new Map(profiles.map(x=>[x.id,x]));
 players=(p.data||[]).map(x=>({...x,...lookup.get(x.user_id)}));
 const labels=id=>short(lookup.get(id));
 rounds=r.data||[];messages=(m.data||[]).reverse();
 const latest=rounds[0],pending=latest&&!latest.choice&&Date.now()-Date.parse(latest.created_at)<120000;
 const current=latest?.choice?latest.target_id:(pending?latest.spinner_id:(players[0]?.user_id||null));
 const target=latest?.target_id;
 const counts={};for(const round of rounds){if(round.choice==='kiss'){counts[round.spinner_id]=(counts[round.spinner_id]||0)+1;counts[round.target_id]=(counts[round.target_id]||0)+1}}
 q('#bottle-score').innerHTML='<strong>💋 Поцілунки (останні 30 ходів)</strong>'+players.map(x=>'<span>'+safe(short(x))+': <b>'+Number(counts[x.user_id]||0)+'</b></span>').join('');
 q('#bottle-online').textContent='🟢 За столом: '+players.length+' / 12';
 seats.innerHTML=players.map((p,i)=>{const a=i/players.length*Math.PI*2-Math.PI/2;const x=50+43*Math.cos(a),y=50+43*Math.sin(a);const photo=/^https:\/\//.test(p.avatar_url||'')?'<img src="'+safe(p.avatar_url)+'" alt="" loading="lazy">':'👤';return '<div class="bottle-seat '+(p.user_id===current?'is-turn ':'')+(pending&&p.user_id===target?'is-chosen':'')+'" style="left:'+x+'%;top:'+y+'%"><span class="bottle-face">'+photo+'</span><span class="bottle-name">'+safe(short(p))+(p.user_id===uid?' (ти)':'')+'</span></div>'}).join('');
 spin.disabled=!joined||players.length<2||!!pending||current!==uid;
 decision.hidden=!(joined&&pending&&target===uid);
 q('#bottle-turn').textContent=pending?'🍾 '+labels(latest.spinner_id)+' обрав(ла) '+labels(target)+'. Чекаємо відповіді…':players.length<2?'Потрібно щонайменше 2 гравці':current===uid?'Твій хід! Крути пляшечку.':'Хід: '+labels(current);
 notify(joined?'Ти у спільній онлайн-кімнаті KONTA':'Натисни «Приєднатися до столу», щоб грати');
 q('#bottle-log').innerHTML=rounds.slice(0,10).map(x=>'<div class="bottle-log-row">'+safe(labels(x.spinner_id))+' → '+safe(labels(x.target_id))+' '+(x.choice==='kiss'?'💋':x.choice==='pass'?'🙈':'⏳')+'</div>').join('')||'Поки немає ходів';
 const chatBox=q('#bottle-chat-log'),atBottom=chatBox.scrollHeight-chatBox.scrollTop-chatBox.clientHeight<60;
 chatBox.innerHTML=messages.map(x=>'<div><b>'+safe(labels(x.user_id))+':</b> '+safe(x.body)+'</div>').join('')||'<div class="muted">Напиши перше повідомлення</div>';
 if(atBottom)chatBox.scrollTop=chatBox.scrollHeight;
 if(latest&&pending){const targetIndex=players.findIndex(x=>x.user_id===target);if(targetIndex>=0){const next=(targetIndex/players.length)*360;const normalized=((angle%360)+360)%360;angle+=((next-normalized+360)%360)+360;pointer.style.transition='transform 1.5s ease-out';pointer.style.transform='translate(-50%,-50%) rotate('+angle+'deg)'}}
}catch(e){notify('Помилка синхронізації: '+e.message)}
finally{loading=false}
}
q('#bottle-join').onclick=join;
q('#bottle-leave').onclick=async()=>{const {error}=await db.from('bottle_players').delete().eq('user_id',uid);if(error){notify(error.message);return}joined=false;q('#bottle-join').hidden=false;q('#bottle-leave').hidden=true;await refresh()};
spin.onclick=async()=>{if(spin.disabled)return;spin.disabled=true;const latest=rounds[0];const pending=latest&&!latest.choice&&Date.now()-Date.parse(latest.created_at)<120000;if(pending){await refresh();return}const others=players.filter(x=>x.user_id!==uid);if(!others.length)return;const target=others[Math.floor(Math.random()*others.length)];const {error}=await db.from('bottle_rounds').insert({spinner_id:uid,target_id:target.user_id});if(error)notify(error.message);await refresh()};
async function decide(choice){const r=rounds[0];if(!r||r.target_id!==uid||r.choice)return;const {error}=await db.from('bottle_rounds').update({choice,decided_at:new Date().toISOString()}).eq('id',r.id).eq('target_id',uid).is('choice',null);if(error)notify(error.message);await refresh()}
q('#bottle-kiss').onclick=()=>decide('kiss');q('#bottle-pass').onclick=()=>decide('pass');
q('#bottle-chat-form').onsubmit=async e=>{e.preventDefault();if(!joined){notify('Спочатку приєднайся до столу');return}const input=q('#bottle-chat-input'),body=input.value.trim();if(!body)return;const {error}=await db.from('bottle_messages').insert({user_id:uid,body});if(error)notify(error.message);else input.value='';await refresh()};
db.auth.getUser().then(async({data,error})=>{if(active!=='bottle')return;if(error||!data.user){notify('Увійди до свого акаунта KONTA, щоб грати онлайн');return}uid=data.user.id;await refresh();clock=setInterval(()=>{if(active!=='bottle'){clearInterval(clock);return}refresh()},3500)}).catch(e=>notify(e.message));
}
function avatar(){let saved={};try{saved=JSON.parse(localStorage.getItem('konta-avatar')||'{}')}catch{}const opts={face:['🙂','😎','🥰','😄','🤩','🧑','👩','👨'],hair:['💇','🧢','🎩','👑','🎀'],look:['👕','👗','🧥','👔','🥋'],pet:['🐱','🐶','🐰','🦊','🐼']};let a={face:saved.face||'🙂',hair:saved.hair||'🧢',look:saved.look||'👕',pet:saved.pet||'🐱'};out.innerHTML='<h2>🧑‍🎤 Мій аватар</h2><p class="muted">Підбери образ — він збережеться у твоєму браузері.</p><div class="avatar" id="preview"></div><div id="choices"></div><button class="primary" id="save">Зберегти образ</button><p id="saved"></p>';function render(){out.querySelector('#preview').textContent=a.hair+' '+a.face+' '+a.look+' '+a.pet;out.querySelector('#choices').innerHTML=Object.entries(opts).map(([key,values])=>'<div class="choices"><b>'+({face:'Обличчя',hair:'Головний убір',look:'Одяг',pet:'Улюбленець'})[key]+': </b>'+values.map(v=>'<button class="option '+(a[key]===v?'selected':'')+'" data-kind="'+key+'" data-value="'+v+'">'+v+'</button>').join('')+'</div>').join('')}render();out.querySelector('#choices').onclick=e=>{const b=e.target.closest('[data-kind]');if(!b)return;a[b.dataset.kind]=b.dataset.value;render()};out.querySelector('#save').onclick=()=>{localStorage.setItem('konta-avatar',JSON.stringify(a));out.querySelector('#saved').textContent='✅ Образ збережено!'}}
function xo(){let cells=Array(9).fill(''),over=false;out.innerHTML='<h2>⭕ Хрестики-нулики</h2><p class="muted">Ти граєш за ❌, комп’ютер — за ⭕.</p><div class="board" id="board"></div><h3 id="status">Твій хід</h3><button class="primary" id="again">Нова гра</button>';const board=out.querySelector('#board'),status=out.querySelector('#status');function winner(){for(const [a,b,c] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(cells[a]&&cells[a]===cells[b]&&cells[b]===cells[c])return cells[a];return cells.every(Boolean)?'draw':null}function paint(){board.innerHTML=cells.map((v,i)=>'<button class="cell" data-i="'+i+'" aria-label="Клітинка '+(i+1)+'">'+v+'</button>').join('')}function turn(i){if(over||cells[i])return;cells[i]='❌';let w=winner();if(!w){const empty=cells.map((x,j)=>x?-1:j).filter(x=>x>=0);const block=empty.find(j=>{let t=[...cells];t[j]='⭕';return check(t,'⭕')});const stop=empty.find(j=>{let t=[...cells];t[j]='❌';return check(t,'❌')});const pick=block??stop??(empty.includes(4)?4:empty[Math.floor(Math.random()*empty.length)]);cells[pick]='⭕';w=winner()}if(w){over=true;status.textContent=w==='draw'?'Нічия 🤝':w==='❌'?'Ти переміг! 🎉':'Комп’ютер переміг'}else status.textContent='Твій хід';paint()}function check(c,v){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(x=>x.every(i=>c[i]===v))}board.onclick=e=>{const b=e.target.closest('[data-i]');if(b)turn(Number(b.dataset.i))};out.querySelector('#again').onclick=()=>{cells=Array(9).fill('');over=false;status.textContent='Твій хід';paint()};paint()}
function snake(){let body=[{x:6,y:6},{x:5,y:6}],dir={x:1,y:0},next=dir,food={x:10,y:7},score=0,dead=false;out.innerHTML='<h2>🐍 Змійка</h2><p class="muted">Керуй стрілками на клавіатурі або кнопками.</p><b id="score">Очки: 0</b><div class="snake" id="field"></div><div class="pad"><button class="up" data-d="up">↑</button><button class="left" data-d="left">←</button><button class="down" data-d="down">↓</button><button class="right" data-d="right">→</button></div><p id="snake-status"></p><button class="primary" id="restart">Почати знову</button>';const field=out.querySelector('#field');function paint(){field.innerHTML=Array.from({length:196},(_,i)=>{const x=i%14,y=Math.floor(i/14);return '<div class="'+(body.some(p=>p.x===x&&p.y===y)?'s':food.x===x&&food.y===y?'f':'')+'"></div>'}).join('')}function change(k){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[k];if(d&&!(d.x===-dir.x&&d.y===-dir.y))next=d}function key(e){if(active!=='snake')return;const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){e.preventDefault();change(k)}}window.removeEventListener('keydown',window.kontaSnakeKey);window.kontaSnakeKey=key;window.addEventListener('keydown',key);out.querySelector('.pad').onclick=e=>{const b=e.target.closest('[data-d]');if(b)change(b.dataset.d)};function tick(){if(dead)return;dir=next;const h={x:body[0].x+dir.x,y:body[0].y+dir.y},eat=h.x===food.x&&h.y===food.y;const collision=body.slice(0,eat?undefined:-1).some(p=>p.x===h.x&&p.y===h.y);if(h.x<0||h.y<0||h.x>=14||h.y>=14||collision){dead=true;clearInterval(timer);out.querySelector('#snake-status').textContent='Гру завершено!';return}body.unshift(h);if(eat){score++;out.querySelector('#score').textContent='Очки: '+score;const free=Array.from({length:196},(_,i)=>({x:i%14,y:Math.floor(i/14)})).filter(p=>!body.some(q=>q.x===p.x&&q.y===p.y));if(!free.length){dead=true;clearInterval(timer);out.querySelector('#snake-status').textContent='Ти виграв!';return}food=free[Math.floor(Math.random()*free.length)]}else body.pop();paint()}out.querySelector('#restart').onclick=snake;paint();timer=setInterval(tick,190)}
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js?v=9"></script></body></html>
