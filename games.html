<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b283c"><title>Ігри — KONTA</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf1ff;background:#101927}*{box-sizing:border-box}body{margin:0}header{background:#1b2a40;padding:16px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#a9c9ff;text-decoration:none}header b{font-size:24px}main{max-width:1100px;margin:28px auto;padding:0 16px}h1{margin-bottom:4px}.muted{color:#a7b8d0}.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:24px 0}.tile,.panel{border:1px solid #354961;background:#202e43;border-radius:18px;padding:20px}.tile{cursor:pointer;text-align:left;color:inherit;font:inherit}.tile:hover,.tile.active{border-color:#649aff;background:#293e5b}.tile .emoji{font-size:44px;display:block;margin-bottom:10px}.tile strong{font-size:19px}.tile small{display:block;margin-top:7px;color:#b7c9e1}.panel{min-height:360px;text-align:center}button{cursor:pointer}button:focus-visible{outline:3px solid #88b5ff}button.primary,.option{border:0;border-radius:10px;padding:11px 18px;background:#3969d8;color:white;font-weight:700;margin:5px}.option{background:#354e72}.option.selected{background:#5188e9}.bottle{font-size:95px;display:inline-block;margin:40px;transition:transform 2.8s cubic-bezier(.2,.8,.2,1)}.players{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.players span{background:#344966;border-radius:30px;padding:10px 16px}.avatar{font-size:100px;line-height:1.4}.choices{margin:12px}.board{display:grid;grid-template-columns:repeat(3,90px);gap:7px;justify-content:center;margin:22px}.cell{height:90px;border:1px solid #6580a8;border-radius:12px;background:#304562;color:white;font-size:45px}.snake{display:grid;grid-template-columns:repeat(14,1fr);width:min(100%,420px);aspect-ratio:1;margin:20px auto;background:#132136;border:2px solid #506989}.snake div{border:1px solid #203149}.snake .s{background:#6db7ff;border-radius:4px}.snake .f{background:#ff7d8c;border-radius:50%}.pad{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:5px}.pad button{height:48px;background:#405d88;color:white;border:0;border-radius:8px}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .down{grid-column:2}.pad .right{grid-column:3}@media(max-width:500px){.board{grid-template-columns:repeat(3,70px)}.cell{height:70px}}
</style></head><body><header><b>🟦 KONTA · Ігри</b><a href="/">← Повернутися до соцмережі</a></header><main><h1>🎮 Ігри KONTA</h1><p class="muted">Обирай гру та відпочивай. Перші власні мініігри KONTA.</p><div class="catalog" id="catalog"></div><section class="panel" id="game" aria-live="polite"><h2>Обери гру вище 👆</h2></section></main><script>
'use strict';
const games=[['bottle','🍾','Пляшечка','Крути пляшечку у компанії'],['avatar','🧑‍🎤','Аватарія KONTA','Створи власного персонажа'],['xo','⭕','Хрестики-нулики','Грай проти комп’ютера'],['snake','🐍','Змійка','Збирай очки й не врізайся']];
const cat=document.querySelector('#catalog'),out=document.querySelector('#game');let active='',timer=null,spin=0;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
cat.innerHTML=games.map(g=>'<button class="tile" data-game="'+g[0]+'"><span class="emoji">'+g[1]+'</span><strong>'+g[2]+'</strong><small>'+g[3]+'</small></button>').join('');
cat.onclick=e=>{const b=e.target.closest('[data-game]');if(b)open(b.dataset.game)};
function open(id){clearInterval(timer);active=id;document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x.dataset.game===id));({bottle,avatar,xo,snake})[id]();}
function bottle(){out.innerHTML='<h2>🍾 Пляшечка</h2><p class="muted">Введи імена гравців через кому, потім крути пляшечку.</p><input id="names" aria-label="Імена гравців" value="Роман, Вікторія, Друг, Подруга" style="width:min(100%,450px);padding:12px;border-radius:10px;background:#122033;color:white;border:1px solid #61799b"><div><span class="bottle" id="bottle">🍾</span></div><button class="primary" id="spin">Крутити!</button><h3 id="result"></h3><div class="players" id="players"></div>';const names=out.querySelector('#names'),p=out.querySelector('#players');function draw(){p.innerHTML=names.value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,12).map(x=>'<span>'+safe(x)+'</span>').join('')}names.oninput=draw;draw();out.querySelector('#spin').onclick=()=>{const arr=names.value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,12);if(arr.length<2){out.querySelector('#result').textContent='Додай щонайменше двох гравців';return}spin+=1440+Math.floor(Math.random()*360);out.querySelector('#bottle').style.transform='rotate('+spin+'deg)';out.querySelector('#result').textContent='Крутимо…';setTimeout(()=>{if(active==='bottle')out.querySelector('#result').textContent='Випало на: '+arr[Math.floor(Math.random()*arr.length)]+' 🎉'},2900)}}
function avatar(){let saved={};try{saved=JSON.parse(localStorage.getItem('konta-avatar')||'{}')}catch{}const opts={face:['🙂','😎','🥰','😄','🤩','🧑','👩','👨'],hair:['💇','🧢','🎩','👑','🎀'],look:['👕','👗','🧥','👔','🥋'],pet:['🐱','🐶','🐰','🦊','🐼']};let a={face:saved.face||'🙂',hair:saved.hair||'🧢',look:saved.look||'👕',pet:saved.pet||'🐱'};out.innerHTML='<h2>🧑‍🎤 Мій аватар</h2><p class="muted">Підбери образ — він збережеться у твоєму браузері.</p><div class="avatar" id="preview"></div><div id="choices"></div><button class="primary" id="save">Зберегти образ</button><p id="saved"></p>';function render(){out.querySelector('#preview').textContent=a.hair+' '+a.face+' '+a.look+' '+a.pet;out.querySelector('#choices').innerHTML=Object.entries(opts).map(([key,values])=>'<div class="choices"><b>'+({face:'Обличчя',hair:'Головний убір',look:'Одяг',pet:'Улюбленець'})[key]+': </b>'+values.map(v=>'<button class="option '+(a[key]===v?'selected':'')+'" data-kind="'+key+'" data-value="'+v+'">'+v+'</button>').join('')+'</div>').join('')}render();out.querySelector('#choices').onclick=e=>{const b=e.target.closest('[data-kind]');if(!b)return;a[b.dataset.kind]=b.dataset.value;render()};out.querySelector('#save').onclick=()=>{localStorage.setItem('konta-avatar',JSON.stringify(a));out.querySelector('#saved').textContent='✅ Образ збережено!'}}
function xo(){let cells=Array(9).fill(''),over=false;out.innerHTML='<h2>⭕ Хрестики-нулики</h2><p class="muted">Ти граєш за ❌, комп’ютер — за ⭕.</p><div class="board" id="board"></div><h3 id="status">Твій хід</h3><button class="primary" id="again">Нова гра</button>';const board=out.querySelector('#board'),status=out.querySelector('#status');function winner(){for(const [a,b,c] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(cells[a]&&cells[a]===cells[b]&&cells[b]===cells[c])return cells[a];return cells.every(Boolean)?'draw':null}function paint(){board.innerHTML=cells.map((v,i)=>'<button class="cell" data-i="'+i+'" aria-label="Клітинка '+(i+1)+'">'+v+'</button>').join('')}function turn(i){if(over||cells[i])return;cells[i]='❌';let w=winner();if(!w){const empty=cells.map((x,j)=>x?-1:j).filter(x=>x>=0);const block=empty.find(j=>{let t=[...cells];t[j]='⭕';return check(t,'⭕')});const stop=empty.find(j=>{let t=[...cells];t[j]='❌';return check(t,'❌')});const pick=block??stop??(empty.includes(4)?4:empty[Math.floor(Math.random()*empty.length)]);cells[pick]='⭕';w=winner()}if(w){over=true;status.textContent=w==='draw'?'Нічия 🤝':w==='❌'?'Ти переміг! 🎉':'Комп’ютер переміг'}else status.textContent='Твій хід';paint()}function check(c,v){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(x=>x.every(i=>c[i]===v))}board.onclick=e=>{const b=e.target.closest('[data-i]');if(b)turn(Number(b.dataset.i))};out.querySelector('#again').onclick=()=>{cells=Array(9).fill('');over=false;status.textContent='Твій хід';paint()};paint()}
function snake(){let body=[{x:6,y:6},{x:5,y:6}],dir={x:1,y:0},next=dir,food={x:10,y:7},score=0,dead=false;out.innerHTML='<h2>🐍 Змійка</h2><p class="muted">Керуй стрілками на клавіатурі або кнопками.</p><b id="score">Очки: 0</b><div class="snake" id="field"></div><div class="pad"><button class="up" data-d="up">↑</button><button class="left" data-d="left">←</button><button class="down" data-d="down">↓</button><button class="right" data-d="right">→</button></div><p id="snake-status"></p><button class="primary" id="restart">Почати знову</button>';const field=out.querySelector('#field');function paint(){field.innerHTML=Array.from({length:196},(_,i)=>{const x=i%14,y=Math.floor(i/14);return '<div class="'+(body.some(p=>p.x===x&&p.y===y)?'s':food.x===x&&food.y===y?'f':'')+'"></div>'}).join('')}function change(k){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[k];if(d&&!(d.x===-dir.x&&d.y===-dir.y))next=d}function key(e){if(active!=='snake')return;const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){e.preventDefault();change(k)}}window.removeEventListener('keydown',window.kontaSnakeKey);window.kontaSnakeKey=key;window.addEventListener('keydown',key);out.querySelector('.pad').onclick=e=>{const b=e.target.closest('[data-d]');if(b)change(b.dataset.d)};function tick(){if(dead)return;dir=next;const h={x:body[0].x+dir.x,y:body[0].y+dir.y},eat=h.x===food.x&&h.y===food.y;const collision=body.slice(0,eat?undefined:-1).some(p=>p.x===h.x&&p.y===h.y);if(h.x<0||h.y<0||h.x>=14||h.y>=14||collision){dead=true;clearInterval(timer);out.querySelector('#snake-status').textContent='Гру завершено!';return}body.unshift(h);if(eat){score++;out.querySelector('#score').textContent='Очки: '+score;const free=Array.from({length:196},(_,i)=>({x:i%14,y:Math.floor(i/14)})).filter(p=>!body.some(q=>q.x===p.x&&q.y===p.y));if(!free.length){dead=true;clearInterval(timer);out.querySelector('#snake-status').textContent='Ти виграв!';return}food=free[Math.floor(Math.random()*free.length)]}else body.pop();paint()}out.querySelector('#restart').onclick=snake;paint();timer=setInterval(tick,190)}
</script></body></html>
