<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b283c"><title>Ігри — KONTA</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf1ff;background:#101927}*{box-sizing:border-box}body{margin:0}header{background:#1b2a40;padding:16px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#a9c9ff;text-decoration:none}header b{font-size:24px}main{max-width:1100px;margin:28px auto;padding:0 16px}h1{margin-bottom:4px}.muted{color:#a7b8d0}.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:24px 0}.tile,.panel{border:1px solid #354961;background:#202e43;border-radius:18px;padding:20px}.tile{cursor:pointer;text-align:left;color:inherit;font:inherit}.tile:hover,.tile.active{border-color:#649aff;background:#293e5b}.tile .emoji{font-size:44px;display:block;margin-bottom:10px}.tile strong{font-size:19px}.tile small{display:block;margin-top:7px;color:#b7c9e1}.panel{min-height:360px;text-align:center}button{cursor:pointer}button:focus-visible{outline:3px solid #88b5ff}button.primary,.option{border:0;border-radius:10px;padding:11px 18px;background:#3969d8;color:white;font-weight:700;margin:5px}.option{background:#354e72}.option.selected{background:#5188e9}.bottle{font-size:95px;display:inline-block;margin:40px;transition:transform 2.8s cubic-bezier(.2,.8,.2,1)}.players{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.players span{background:#344966;border-radius:30px;padding:10px 16px}.avatar{font-size:100px;line-height:1.4}.choices{margin:12px}.board{display:grid;grid-template-columns:repeat(3,90px);gap:7px;justify-content:center;margin:22px}.cell{height:90px;border:1px solid #6580a8;border-radius:12px;background:#304562;color:white;font-size:45px}.snake{display:grid;grid-template-columns:repeat(14,1fr);width:min(100%,420px);aspect-ratio:1;margin:20px auto;background:#132136;border:2px solid #506989}.snake div{border:1px solid #203149}.snake .s{background:#6db7ff;border-radius:4px}.snake .f{background:#ff7d8c;border-radius:50%}.pad{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:5px}.pad button{height:48px;background:#405d88;color:white;border:0;border-radius:8px}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .down{grid-column:2}.pad .right{grid-column:3}@media(max-width:500px){.board{grid-template-columns:repeat(3,70px)}.cell{height:70px}}
.bottle-game{max-width:760px;margin:auto}.bottle-toolbar{display:flex;align-items:end;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px 0}.bottle-toolbar label{font-size:13px;color:#b7c9e1;text-align:left;flex:1;min-width:200px}.bottle-toolbar input{display:block;width:100%;margin-top:5px;padding:12px;background:#122033;color:white;border:1px solid #61799b;border-radius:10px}.bottle-table{position:relative;width:min(100%,520px);aspect-ratio:1;margin:18px auto 24px}.bottle-disc{position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle,#385b83 0%,#263e5b 57%,#152b43 100%);border:9px solid #7c9dc2;box-shadow:inset 0 0 35px #0e2138,0 14px 28px #0b1525}.bottle-pointer{position:absolute;left:50%;top:50%;font-size:clamp(68px,13vw,110px);line-height:1;transform:translate(-50%,-50%);transform-origin:center center;z-index:3;filter:drop-shadow(0 5px 8px #081323);pointer-events:none}.bottle-center{position:absolute;left:50%;top:50%;transform:translate(-50%,70px);font-weight:900;letter-spacing:3px;color:#9ebfe5;pointer-events:none}.bottle-center small{display:block;font-size:10px;letter-spacing:1px}.bottle-seat{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;flex-direction:column;width:84px;z-index:4}.bottle-face{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#3a5b82;border:3px solid #7c9dc2;font-size:28px}.bottle-name{font-size:12px;font-weight:700;background:#14243b;padding:3px 7px;border-radius:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bottle-seat.is-turn .bottle-face{border-color:#ffd66d;box-shadow:0 0 0 4px #ffd66d33}.bottle-seat.is-chosen .bottle-face{border-color:#ff85ae;box-shadow:0 0 0 4px #ff85ae44}.bottle-turn{font-weight:750;font-size:19px;min-height:30px;margin:15px}.bottle-decision{margin:12px}.bottle-decision[hidden],#bottle-spin[hidden]{display:none}.bottle-history{margin:22px auto 8px;max-width:480px;text-align:left}.bottle-log-row{padding:10px;border-bottom:1px solid #405470}.bottle-note{font-size:12px}@media(max-width:500px){.bottle-seat{width:62px}.bottle-face{width:38px;height:38px;font-size:21px;border-width:2px}.bottle-name{font-size:10px}.bottle-disc{border-width:5px}.bottle-center{display:none}}
.bottle-score{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:14px 0}.bottle-score strong,.bottle-score span{background:#304562;border-radius:12px;padding:8px 12px}.bottle-face img{width:100%;height:100%;object-fit:cover;border-radius:50%}.bottle-photo-label{position:absolute;top:-8px;right:2px;cursor:pointer;font-size:12px;background:#243750;border-radius:50%;padding:2px}.bottle-photo-label input{position:absolute;width:1px;height:1px;opacity:0}.bottle-chat{margin:24px auto;max-width:520px;text-align:left}.bottle-chat-log{height:170px;overflow:auto;background:#132136;border:1px solid #405470;border-radius:12px;padding:12px}.bottle-chat-log div{margin:5px 0;overflow-wrap:anywhere}.bottle-chat form{display:flex;gap:6px;margin-top:8px}.bottle-chat select,.bottle-chat input{min-width:0;background:#122033;color:white;border:1px solid #61799b;border-radius:9px;padding:9px}.bottle-chat select{width:110px}.bottle-chat input{flex:1}.bottle-chat .primary{margin:0}@media(max-width:500px){.bottle-photo-label{right:-4px;top:-12px}}
</style></head><body><header><b>🟦 KONTA · Ігри</b><a href="/">← Повернутися до соцмережі</a></header><main><h1>🎮 Ігри KONTA</h1><p class="muted">Обирай гру та відпочивай. Перші власні мініігри KONTA.</p><div class="catalog" id="catalog"></div><section class="panel" id="game" aria-live="polite"><h2>Обери гру вище 👆</h2></section></main><script>
'use strict';
const games=[['bottle','🍾','Пляшечка','Крути пляшечку у компанії'],['avatar','🧑‍🎤','Аватарія KONTA','Створи власного персонажа'],['xo','⭕','Хрестики-нулики','Грай проти комп’ютера'],['snake','🐍','Змійка','Збирай очки й не врізайся']];
const cat=document.querySelector('#catalog'),out=document.querySelector('#game');let active='',timer=null,spin=0;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
cat.innerHTML=games.map(g=>'<button class="tile" data-game="'+g[0]+'"><span class="emoji">'+g[1]+'</span><strong>'+g[2]+'</strong><small>'+g[3]+'</small></button>').join('');
cat.onclick=e=>{const b=e.target.closest('[data-game]');if(b)open(b.dataset.game)};
function open(id){clearInterval(timer);active=id;document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x.dataset.game===id));({bottle,avatar,xo,snake})[id]();}
function bottle(){
let names=['Роман','Вікторія','Друг','Подруга','Олександр','Марія'],current=0,chosen=-1,angle=0,busy=false,round=0,history=[];let kisses=JSON.parse(localStorage.getItem('konta-bottle-kisses')||'{}'),profilePhotos={},chat=JSON.parse(localStorage.getItem('konta-bottle-chat')||'[]');
out.innerHTML=`<div class="bottle-game"><h2>🍾 Бутилочка · KONTA</h2><p class="muted">Як у класичній грі: крути пляшечку, обирай пару та вирішуй, чи дарувати поцілунок 💋</p><div class="bottle-toolbar"><label>Гравці KONTA (точне ім’я або @нік, через кому)<input id="bottle-names" maxlength="240" value="Роман, Вікторія, Друг, Подруга, Олександр, Марія"></label><button class="option" id="bottle-update">Оновити стіл</button></div><div class="bottle-score" id="bottle-score"></div><div class="bottle-table" id="bottle-table"><div class="bottle-disc"></div><div class="bottle-pointer" id="bottle-pointer">🍾</div><div class="bottle-center">KONTA<small>Бутилочка</small></div><div id="bottle-seats"></div></div><div class="bottle-turn" id="bottle-turn"></div><button class="primary" id="bottle-spin">🍾 Крутити пляшечку</button><div class="bottle-decision" id="bottle-decision" hidden><button class="primary" id="bottle-kiss">💋 Поцілувати</button><button class="option" id="bottle-pass">🙈 Пропустити</button></div><div class="bottle-chat"><h3>💬 Чат за столом</h3><div id="bottle-chat-log" class="bottle-chat-log"></div><form id="bottle-chat-form"><select id="bottle-chat-author" aria-label="Хто пише"></select><input id="bottle-chat-input" maxlength="300" placeholder="Напиши повідомлення…" required><button class="primary" type="submit">➤</button></form></div><div class="bottle-history"><h3>Історія гри</h3><div id="bottle-log" class="muted">Поки немає ходів</div></div><p class="muted bottle-note">Гра за одним пристроєм. Дії відбуваються лише за взаємною згодою.</p></div>`;
const q=x=>out.querySelector(x),table=q('#bottle-table'),seats=q('#bottle-seats'),pointer=q('#bottle-pointer'),turn=q('#bottle-turn'),spinBtn=q('#bottle-spin'),decision=q('#bottle-decision');
async function loadProfilePhotos(){
 if(!window.supabase||!window.KONTA_CONFIG)return;
 const client=window.supabase.createClient(window.KONTA_CONFIG.supabaseUrl,window.KONTA_CONFIG.supabasePublishableKey);
 const {data:{user}}=await client.auth.getUser();
 if(!user)return;
 const {data,error}=await client.from('profiles').select('id,username,display_name,avatar_url').limit(1000);
 if(error||!data)return;
 profilePhotos={};
 for(const name of names){
  const key=name.trim().replace(/^@/,'').toLocaleLowerCase('uk');
  const matches=data.filter(p=>p.username?.toLocaleLowerCase('uk')===key||p.display_name?.toLocaleLowerCase('uk')===key);
  if(matches.length===1&&/^https:\/\//i.test(matches[0].avatar_url||''))profilePhotos[name]=matches[0].avatar_url;
 }
 const self=data.find(p=>p.id===user.id);
 if(self&&names.includes(self.display_name)&&/^https:\/\//i.test(self.avatar_url||''))profilePhotos[self.display_name]=self.avatar_url;
 paint();
}
function score(){q('#bottle-score').innerHTML='<strong>💋 Поцілунки</strong>'+names.map(n=>'<span>'+safe(n)+': <b>'+Number(kisses[n]||0)+'</b></span>').join('')}
function chatPaint(){q('#bottle-chat-author').innerHTML=names.map(n=>'<option>'+safe(n)+'</option>').join('');q('#bottle-chat-log').innerHTML=chat.slice(-50).map(m=>'<div><b>'+safe(m.author)+':</b> '+safe(m.body)+'</div>').join('')||'<div class="muted">Поки немає повідомлень</div>';q('#bottle-chat-log').scrollTop=q('#bottle-chat-log').scrollHeight}
q('#bottle-chat-form').onsubmit=e=>{e.preventDefault();const author=q('#bottle-chat-author').value,body=q('#bottle-chat-input').value.trim();if(!body)return;chat.push({author,body});chat=chat.slice(-100);localStorage.setItem('konta-bottle-chat',JSON.stringify(chat));q('#bottle-chat-input').value='';chatPaint();q('#bottle-chat-author').value=author};
function paint(){score();seats.innerHTML=names.map((n,i)=>{const a=(i/names.length)*Math.PI*2-Math.PI/2;const x=50+43*Math.cos(a),y=50+43*Math.sin(a);const face=profilePhotos[n]?'<img src="'+safe(profilePhotos[n])+'" alt="Аватар '+safe(n)+'" loading="lazy">':'👤';return '<div class="bottle-seat '+(i===current?'is-turn ':'')+(i===chosen?'is-chosen':'')+'" style="left:'+x+'%;top:'+y+'%"><span class="bottle-face">'+face+'</span><span class="bottle-name">'+safe(n)+'</span></div>'}).join('');turn.textContent=chosen<0?'Хід гравця: '+names[current]:'Пляшечка обрала: '+names[current]+' → '+names[chosen];}
function log(message){history.unshift(message);q('#bottle-log').innerHTML=history.slice(0,8).map((v,i)=>'<div class="bottle-log-row">'+(i===0?'✨ ':'')+safe(v)+'</div>').join('')}
q('#bottle-update').onclick=()=>{if(busy)return;const next=q('#bottle-names').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,10);if(next.length<2){turn.textContent='Додай хоча б двох гравців';return}names=next;current=0;chosen=-1;decision.hidden=true;round=0;history=[];chatPaint();q('#bottle-log').textContent='Поки немає ходів';angle=0;loadProfilePhotos().catch(()=>{});pointer.style.transition='none';pointer.style.transform='translate(-50%,-50%) rotate(0deg)';paint()};
spinBtn.onclick=()=>{if(busy||chosen>=0)return;if(names.length<2)return;busy=true;spinBtn.disabled=true;turn.textContent='🍾 Пляшечка крутиться…';const possible=names.map((_,i)=>i).filter(i=>i!==current);const target=possible[Math.floor(Math.random()*possible.length)];const targetAngle=(target/names.length)*360;const normalized=((angle%360)+360)%360;const delta=((targetAngle-normalized+360)%360)+1440+360*Math.floor(Math.random()*2);angle+=delta;pointer.style.transition='transform 3.2s cubic-bezier(.13,.72,.16,1)';pointer.style.transform='translate(-50%,-50%) rotate('+angle+'deg)';setTimeout(()=>{if(active!=='bottle')return;chosen=target;busy=false;paint();decision.hidden=false;spinBtn.hidden=true;},3300)};
function finish(kiss){if(chosen<0)return;if(kiss){kisses[names[current]]=(kisses[names[current]]||0)+1;kisses[names[chosen]]=(kisses[names[chosen]]||0)+1;localStorage.setItem('konta-bottle-kisses',JSON.stringify(kisses))}log(names[current]+' → '+names[chosen]+(kiss?' — 💋 поцілунок':' — 🙈 пропуск'));current=chosen;chosen=-1;round++;decision.hidden=true;spinBtn.hidden=false;spinBtn.disabled=false;paint();}
q('#bottle-kiss').onclick=()=>finish(true);q('#bottle-pass').onclick=()=>finish(false);chatPaint();paint();loadProfilePhotos().catch(()=>{});
}
function avatar(){let saved={};try{saved=JSON.parse(localStorage.getItem('konta-avatar')||'{}')}catch{}const opts={face:['🙂','😎','🥰','😄','🤩','🧑','👩','👨'],hair:['💇','🧢','🎩','👑','🎀'],look:['👕','👗','🧥','👔','🥋'],pet:['🐱','🐶','🐰','🦊','🐼']};let a={face:saved.face||'🙂',hair:saved.hair||'🧢',look:saved.look||'👕',pet:saved.pet||'🐱'};out.innerHTML='<h2>🧑‍🎤 Мій аватар</h2><p class="muted">Підбери образ — він збережеться у твоєму браузері.</p><div class="avatar" id="preview"></div><div id="choices"></div><button class="primary" id="save">Зберегти образ</button><p id="saved"></p>';function render(){out.querySelector('#preview').textContent=a.hair+' '+a.face+' '+a.look+' '+a.pet;out.querySelector('#choices').innerHTML=Object.entries(opts).map(([key,values])=>'<div class="choices"><b>'+({face:'Обличчя',hair:'Головний убір',look:'Одяг',pet:'Улюбленець'})[key]+': </b>'+values.map(v=>'<button class="option '+(a[key]===v?'selected':'')+'" data-kind="'+key+'" data-value="'+v+'">'+v+'</button>').join('')+'</div>').join('')}render();out.querySelector('#choices').onclick=e=>{const b=e.target.closest('[data-kind]');if(!b)return;a[b.dataset.kind]=b.dataset.value;render()};out.querySelector('#save').onclick=()=>{localStorage.setItem('konta-avatar',JSON.stringify(a));out.querySelector('#saved').textContent='✅ Образ збережено!'}}
function xo(){let cells=Array(9).fill(''),over=false;out.innerHTML='<h2>⭕ Хрестики-нулики</h2><p class="muted">Ти граєш за ❌, комп’ютер — за ⭕.</p><div class="board" id="board"></div><h3 id="status">Твій хід</h3><button class="primary" id="again">Нова гра</button>';const board=out.querySelector('#board'),status=out.querySelector('#status');function winner(){for(const [a,b,c] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(cells[a]&&cells[a]===cells[b]&&cells[b]===cells[c])return cells[a];return cells.every(Boolean)?'draw':null}function paint(){board.innerHTML=cells.map((v,i)=>'<button class="cell" data-i="'+i+'" aria-label="Клітинка '+(i+1)+'">'+v+'</button>').join('')}function turn(i){if(over||cells[i])return;cells[i]='❌';let w=winner();if(!w){const empty=cells.map((x,j)=>x?-1:j).filter(x=>x>=0);const block=empty.find(j=>{let t=[...cells];t[j]='⭕';return check(t,'⭕')});const stop=empty.find(j=>{let t=[...cells];t[j]='❌';return check(t,'❌')});const pick=block??stop??(empty.includes(4)?4:empty[Math.floor(Math.random()*empty.length)]);cells[pick]='⭕';w=winner()}if(w){over=true;status.textContent=w==='draw'?'Нічия 🤝':w==='❌'?'Ти переміг! 🎉':'Комп’ютер переміг'}else status.textContent='Твій хід';paint()}function check(c,v){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(x=>x.every(i=>c[i]===v))}board.onclick=e=>{const b=e.target.closest('[data-i]');if(b)turn(Number(b.dataset.i))};out.querySelector('#again').onclick=()=>{cells=Array(9).fill('');over=false;status.textContent='Твій хід';paint()};paint()}
function snake(){let body=[{x:6,y:6},{x:5,y:6}],dir={x:1,y:0},next=dir,food={x:10,y:7},score=0,dead=false;out.innerHTML='<h2>🐍 Змійка</h2><p class="muted">Керуй стрілками на клавіатурі або кнопками.</p><b id="score">Очки: 0</b><div class="snake" id="field"></div><div class="pad"><button class="up" data-d="up">↑</button><button class="left" data-d="left">←</button><button class="down" data-d="down">↓</button><button class="right" data-d="right">→</button></div><p id="snake-status"></p><button class="primary" id="restart">Почати знову</button>';const field=out.querySelector('#field');function paint(){field.innerHTML=Array.from({length:196},(_,i)=>{const x=i%14,y=Math.floor(i/14);return '<div class="'+(body.some(p=>p.x===x&&p.y===y)?'s':food.x===x&&food.y===y?'f':'')+'"></div>'}).join('')}function change(k){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[k];if(d&&!(d.x===-dir.x&&d.y===-dir.y))next=d}function key(e){if(active!=='snake')return;const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){e.preventDefault();change(k)}}window.removeEventListener('keydown',window.kontaSnakeKey);window.kontaSnakeKey=key;window.addEventListener('keydown',key);out.querySelector('.pad').onclick=e=>{const b=e.target.closest('[data-d]');if(b)change(b.dataset.d)};function tick(){if(dead)return;dir=next;const h={x:body[0].x+dir.x,y:body[0].y+dir.y},eat=h.x===food.x&&h.y===food.y;const collision=body.slice(0,eat?undefined:-1).some(p=>p.x===h.x&&p.y===h.y);if(h.x<0||h.y<0||h.x>=14||h.y>=14||collision){dead=true;clearInterval(timer);out.querySelector('#snake-status').textContent='Гру завершено!';return}body.unshift(h);if(eat){score++;out.querySelector('#score').textContent='Очки: '+score;const free=Array.from({length:196},(_,i)=>({x:i%14,y:Math.floor(i/14)})).filter(p=>!body.some(q=>q.x===p.x&&q.y===p.y));if(!free.length){dead=true;clearInterval(timer);out.querySelector('#snake-status').textContent='Ти виграв!';return}food=free[Math.floor(Math.random()*free.length)]}else body.pop();paint()}out.querySelector('#restart').onclick=snake;paint();timer=setInterval(tick,190)}
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js?v=9"></script></body></html>
