name: Crowd Rush game check
on:
  push:
    paths: ['crowd-rush.html', 'games.html', 'mobile/src/Extras.js', 'tests/crowd-rush-smoke.mjs']
  pull_request:
    paths: ['crowd-rush.html', 'games.html', 'mobile/src/Extras.js', 'tests/crowd-rush-smoke.mjs']
jobs:
  browser-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate gameplay JavaScript and entry points
        run: node tests/crowd-rush-smoke.mjs
