name: Import published KONTA website
on:
  push:
    paths:
      - '.github/workflows/import-konta.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public site source and assets
        env:
          KONTA_SITE: https://tangerine-malasada-999f89.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          for file in index.html app.js styles.css config.js sw.js manifest.webmanifest; do
            echo "Downloading $file"
            curl --fail --location --silent --show-error --retry 3 "${KONTA_SITE}/${file}" -o "${file}"
          done
          for file in icon-192.png icon-512.png; do
            curl --fail --location --silent --show-error --retry 3 "${KONTA_SITE}/assets/${file}" -o "assets/${file}"
          done
          python3 - <<'PY'
          from pathlib import Path
          assert '<html' in Path('index.html').read_text().lower(), 'Not an HTML page'
          assert 'KONTA' in Path('index.html').read_text(), 'Unexpected website'
          assert 'supabase' in Path('app.js').read_text().lower(), 'Unexpected app.js'
          assert 'KONTA_CONFIG' in Path('config.js').read_text(), 'Unexpected configuration'
          assert 'sb_secret_' not in Path('config.js').read_text(), 'Secret key found!'
          assert 'service_role' not in Path('config.js').read_text().split('window.KONTA_CONFIG')[1], 'Service role key found!'
          assert Path('assets/icon-192.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), 'Invalid PNG'
          assert Path('assets/icon-512.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), 'Invalid PNG'
          print('KONTA files verified')
          PY
      - name: Save files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css config.js sw.js manifest.webmanifest assets/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import KONTA website from current Netlify deployment"
            git push
          fi
